[project]
name = "the-data-vault-server"
version = "1.0.0"
description = "FastAPI backend with real-time competitive scoring for The Data Vault"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.18",
]

[tool.uv]
package = false
