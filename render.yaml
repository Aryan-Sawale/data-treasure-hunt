services:
  - type: web
    name: data-vault-backend
    runtime: python
    rootDir: server
    buildCommand: uv sync --frozen && uv cache prune --ci
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ADMIN_PASSWORD
        value: abnamro2026

